name: DevTool Lead Scraper Midnight Run

on:
  schedule:
    # Runs at 00:00 UTC every day
    - cron: "0 0 * * *"
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install Dependencies
        run: npm ci

      - name: Run Lead Scraper
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EVE_URL: ${{ secrets.EVE_URL }}
          EVE_ROUTE_TOKEN: ${{ secrets.EVE_ROUTE_TOKEN }}
        run: |
          npx tsx src/index.ts --preset ATS_HIRING --limit 5
          npx tsx src/index.ts --preset AI_DEVTOOLS --limit 5
          npx tsx src/index.ts --preset AUTH_COMPETITORS --limit 5
          npx tsx src/index.ts --preset CMS_COMPETITORS --limit 5
          npx tsx src/index.ts --preset BAAS_COMPETITORS --limit 5
          npx tsx src/index.ts --preset YC_STARTUPS --limit 5
          npx tsx src/index.ts --preset G2_CAPTERRA --limit 5

      - name: Commit & Push CSV Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(data): update lead exports and deduplication history [skip ci]"
          file_pattern: "*.csv data/*.csv"
